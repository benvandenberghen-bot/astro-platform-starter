<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eenvoudige Gevelcalculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Gevelcalculator</h1>
      <p class="subtitle">Bereken snel de bruto en netto geveloppervlakte.</p>

      <form id="gevel-form" class="calculator" novalidate>
        <label for="breedte">Breedte gevel (m)</label>
        <input type="number" id="breedte" min="0" step="0.01" required />

        <label for="hoogte">Hoogte gevel (m)</label>
        <input type="number" id="hoogte" min="0" step="0.01" required />

        <label for="ramen">Totale raamoppervlakte (m²)</label>
        <input type="number" id="ramen" min="0" step="0.01" required />

        <button type="submit">Bereken</button>
      </form>

      <section id="resultaat" class="resultaat" aria-live="polite">
        <h2>Resultaat</h2>
        <p><strong>Bruto geveloppervlakte:</strong> <span id="bruto">-</span> m²</p>
        <p><strong>Netto geveloppervlakte:</strong> <span id="netto">-</span> m²</p>
        <p id="formule" class="formule">Formule: -</p>
        <p id="melding" class="melding"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
